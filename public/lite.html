<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>zorn.ai</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#0b0d14;--panel:#141824;--text:#e8eaf2;--muted:#8b91a8;--accent:#7c5cff;--accent2:#00d4ff;--user:#1f2540;--border:#232940}
@media(prefers-color-scheme:light){:root{--bg:#f6f7fb;--panel:#fff;--text:#161a2b;--muted:#6b7190;--user:#e9e6ff;--border:#e1e4f0}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
.logo{font-weight:800;font-size:22px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--border);background:var(--panel)}
#userbox{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
#userbox img{width:30px;height:30px;border-radius:50%}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:5px 10px}
#login{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
#login h1{margin:0;font-size:44px}#login p{margin:0;color:var(--muted);max-width:340px}
#app{flex:1;display:none;flex-direction:column;min-height:0}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(720px,88%);padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:var(--user);border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:4px}
.bot pre{background:#0006;color:#e8eaf2;padding:10px;border-radius:8px;overflow-x:auto;white-space:pre;position:relative}
.bot code{font-family:ui-monospace,Menlo,monospace;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.chip{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:6px 12px;font-size:14px}
#bar{display:flex;gap:8px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);background:var(--panel)}
#input{flex:1;resize:none;max-height:140px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font:inherit}
#send{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff;border-radius:12px;padding:0 18px;font-weight:700}
.empty{margin:auto;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <span class="logo">zorn.ai</span>
  <div id="userbox" hidden><img id="avatar" alt=""><span id="uname"></span><button class="ghost" id="logout">Logout</button></div>
</header>

<section id="login">
  <h1 class="logo">zorn.ai</h1>
  <p>Your own assistant. No API key, no LLM, no server. Sign in with Google to start.</p>
  <div id="gbtn"></div>
  <p id="warn" style="color:#ff8a8a"></p>
</section>

<section id="app">
  <div id="chat"></div>
  <div id="bar">
    <textarea id="input" rows="1" placeholder="Ask, calculate, or teach me something..."></textarea>
    <button id="send">Send</button>
  </div>
</section>

<script>
// ====== SETTINGS ======
const GOOGLE_CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID"; // from Google Cloud Console (public value, not a secret)

// ====== KNOWLEDGE BASE (edit/extend freely) ======
const c = (l, s) => "```" + l + "\n" + s + "\n```";
const KB = [
["hello hi hey greetings", "Hello! I'm zorn.ai. Ask me about coding, calculate something (try 12*(3+4)), or teach me new answers with:  teach: question => answer"],
["who are you name zorn", "I'm zorn.ai, a rule-based assistant with a built-in knowledge base. I don't use any LLM or API key, so I know a focused set of topics, and you can teach me more."],
["help commands can do features", "I can:\n• Answer coding and tech questions from my knowledge base\n• Calculate: 25*4+10, sqrt(144), 2^10\n• Tell the time and date\n• Learn: teach: what is X => X is ...\n• Forget: forget: what is X\n• List topics: topics"],
["variable variables let const declare", "A variable stores a value under a name.\n" + c("js", "let count = 1;     // can change\nconst name = 'Zorn'; // cannot be reassigned") + "In Python: count = 1"],
["loop loops for while iterate", c("js", "for (let i = 0; i < 5; i++) console.log(i);\nfor (const x of [1,2,3]) console.log(x);\nlet n = 0; while (n < 3) { n++; }") + c("python", "for i in range(5):\n    print(i)\nfor x in [1, 2, 3]:\n    print(x)")],
["function functions define method", c("js", "function add(a, b) { return a + b; }\nconst mul = (a, b) => a * b;") + c("python", "def add(a, b):\n    return a + b")],
["array list arrays lists push", c("js", "const a = [1, 2, 3];\na.push(4);            // add\na.map(x => x * 2);    // transform\na.filter(x => x > 1); // keep some\na.reduce((s, x) => s + x, 0); // sum")],
["object dictionary dict json", c("js", "const user = { name: 'Ali', age: 20 };\nuser.name; user['age'];\nJSON.stringify(user);        // object -> text\nJSON.parse('{\"a\":1}');       // text -> object")],
["async await promise asynchronous", "async/await lets you write asynchronous code that reads like normal code.\n" + c("js", "async function load() {\n  try {\n    const res = await fetch('https://api.example.com/data');\n    if (!res.ok) throw new Error('HTTP ' + res.status);\n    return await res.json();\n  } catch (e) { console.error(e); }\n}")],
["fetch http request get post api call", c("js", "// POST JSON\nconst res = await fetch('/api/items', {\n  method: 'POST',\n  headers: { 'Content-Type': 'application/json' },\n  body: JSON.stringify({ name: 'test' })\n});\nconst data = await res.json();")],
["rest api what restful endpoint", "A REST API exposes resources over HTTP using methods: GET (read), POST (create), PUT/PATCH (update), DELETE (remove). Each resource has a URL like /users/42, and data usually travels as JSON. Status codes: 200 OK, 201 Created, 400 Bad Request, 401 Unauthorized, 404 Not Found, 500 Server Error."],
["api key what is", "An API key is a secret token that identifies you to a service so it can authorize and bill requests. Never put one in front-end code, because anyone can read it. Keep keys on a server or in environment variables."],
["llm what large language model", "An LLM (large language model) is a neural network trained on huge amounts of text to predict the next token. I'm not one: I'm a rule-based assistant that matches your question to a hand-written knowledge base."],
["ai artificial intelligence what machine learning", "AI is software that performs tasks that normally need human intelligence. Machine learning is a branch of AI where models learn patterns from data instead of following hand-written rules. Deep learning uses large neural networks."],
["git commands github version control", c("bash", "git init\ngit add .\ngit commit -m \"message\"\ngit branch feature && git checkout feature\ngit pull\ngit push origin main\ngit log --oneline\ngit stash   # save work temporarily")],
["sql select query database table", c("sql", "SELECT name, age FROM users WHERE age > 18 ORDER BY name LIMIT 10;\nINSERT INTO users (name, age) VALUES ('Ali', 20);\nUPDATE users SET age = 21 WHERE name = 'Ali';\nDELETE FROM users WHERE id = 5;\nSELECT u.name, o.total FROM users u JOIN orders o ON o.user_id = u.id;")],
["html page skeleton template boilerplate basic", c("html", "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>My Page</title>\n</head>\n<body>\n  <h1>Hello</h1>\n</body>\n</html>")],
["css flexbox center centre align", c("css", ".parent {\n  display: flex;\n  justify-content: center; /* horizontal */\n  align-items: center;     /* vertical */\n  min-height: 100vh;\n}")],
["css grid layout columns", c("css", ".grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));\n  gap: 16px;\n}")],
["python read file open write", c("python", "with open('data.txt', 'r') as f:\n    text = f.read()\nwith open('out.txt', 'w') as f:\n    f.write('hello')")],
["regex regular expression pattern email", c("js", "const email = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;\nemail.test('a@b.com');   // true\n'a1b22'.match(/\\d+/g);   // ['1','22']")],
["recursion recursive factorial fibonacci", "Recursion means a function calls itself with a smaller input until it hits a base case.\n" + c("python", "def fact(n):\n    return 1 if n <= 1 else n * fact(n - 1)")],
["big o complexity time performance", "Big-O describes how runtime grows with input size n: O(1) constant, O(log n) binary search, O(n) loop, O(n log n) good sorting, O(n^2) nested loops. Prefer lower growth rates for large data."],
["sort sorting algorithm bubble quick", c("js", "[3,1,2].sort((a, b) => a - b);   // numbers ascending\n['b','a'].sort();               // strings") + "Quick sort and merge sort are O(n log n) on average; bubble sort is O(n^2)."],
["godot movement player gdscript character", c("gdscript", "extends CharacterBody3D\nconst SPEED = 6.0\nfunc _physics_process(delta):\n\tvar dir = Input.get_vector('left', 'right', 'forward', 'back')\n\tvelocity.x = dir.x * SPEED\n\tvelocity.z = dir.y * SPEED\n\tmove_and_slide()")],
["node express server create web", c("js", "const express = require('express');\nconst app = express();\napp.use(express.json());\napp.get('/', (req, res) => res.send('Hello'));\napp.listen(3000);")],
["react component usestate hook", c("jsx", "import { useState } from 'react';\nexport default function Counter() {\n  const [n, setN] = useState(0);\n  return <button onClick={() => setN(n + 1)}>Clicked {n}</button>;\n}")],
["dns what domain", "DNS (Domain Name System) translates names like example.com into IP addresses so browsers can find servers."],
["http https what difference", "HTTP is the protocol browsers use to talk to servers. HTTPS is HTTP encrypted with TLS, so data can't be read or altered in transit. Always use HTTPS for logins."],
["bug debug error fix debugging", "Debugging checklist:\n1. Read the full error message and line number.\n2. Reproduce it with the smallest example.\n3. Print or log values near the failure.\n4. Check types, null/undefined, and off-by-one errors.\n5. Search the exact error text.\n6. Undo recent changes to find what broke it."],
["password security hash store safe", "Never store plain-text passwords. Hash them with a slow algorithm such as bcrypt or argon2 (with a salt), use HTTPS, and add rate limiting. Never commit secrets to Git; use environment variables."],
];
const TOPICS = ["variables", "loops", "functions", "arrays", "objects/JSON", "async/await", "fetch/HTTP", "REST API", "API key", "LLM / AI", "Git", "SQL", "HTML", "CSS flexbox/grid", "Python files", "regex", "recursion", "Big-O", "sorting", "Godot movement", "Node/Express", "React", "DNS", "HTTPS", "debugging", "password security"];
const STOP = new Set("the a an is are of to in on for and or how do i you what can with me my it this that please tell about give show write code example".split(" "));

// ====== ENGINE ======
const $ = id => document.getElementById(id);
const tok = s => s.toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(w => w && !STOP.has(w));
const taught = () => { try { return JSON.parse(localStorage.getItem("zorn_taught") || "[]"); } catch { return []; } };
const saveTaught = a => { try { localStorage.setItem("zorn_taught", JSON.stringify(a)); } catch {} };

function calc(q) {
  let e = q.toLowerCase().replace(/^(calc|calculate|what is|whats|compute)\s*/, "").replace(/\bsqrt\b/g, "Math.sqrt").replace(/\^/g, "**").replace(/\bpi\b/g, "Math.PI").replace(/x/g, "*");
  if (!/^[\d\s+\-*/().%,Math.sqrtPIabsflorceilnd]+$/.test(e) || !/\d/.test(e)) return null;
  try { const v = Function('"use strict";return (' + e + ")")(); return typeof v === "number" && isFinite(v) ? String(+v.toPrecision(12)) : null; } catch { return null; }
}

function answer(q) {
  const t = q.trim(), l = t.toLowerCase();
  let m;
  if ((m = t.match(/^teach:\s*(.+?)\s*=>\s*([\s\S]+)$/i))) {
    const a = taught().filter(x => x.q.toLowerCase() !== m[1].toLowerCase());
    a.push({ q: m[1], a: m[2] }); saveTaught(a);
    return "Got it! I learned: \"" + m[1] + "\". Ask me again anytime.";
  }
  if ((m = t.match(/^forget:\s*(.+)$/i))) {
    const a = taught(), n = a.filter(x => x.q.toLowerCase() !== m[1].trim().toLowerCase());
    saveTaught(n); return n.length < a.length ? "Forgotten." : "I don't have that taught entry.";
  }
  if (/^topics?$/.test(l)) return "I know about:\n• " + TOPICS.join("\n• ") + (taught().length ? "\n\nPlus " + taught().length + " things you taught me." : "");
  if (/\b(time|date|today|day)\b/.test(l) && l.split(" ").length < 6) return new Date().toLocaleString("en-US", { dateStyle: "full", timeStyle: "short" });
  const r = calc(t); if (r !== null) return "= " + r;

  const qt = tok(t); if (!qt.length) return "Could you say a bit more?";
  let best = null, bs = 0;
  for (const x of taught()) {
    const xt = tok(x.q); if (!xt.length) continue;
    const ov = qt.filter(w => xt.includes(w)).length, s = ov / Math.max(xt.length, qt.length) * 3;
    if (ov && s > bs) { bs = s; best = x.a; }
  }
  for (const [kw, a] of KB) {
    const kt = kw.split(" ");
    const s = qt.reduce((n, w) => n + (kt.includes(w) ? 1 : (w.length > 3 && kt.some(k => k.startsWith(w) || w.startsWith(k)) ? 0.5 : 0)), 0);
    if (s > bs) { bs = s; best = a; }
  }
  if (best && bs >= 0.5) return best;
  return "I don't know that yet. I'm a rule-based assistant, so my knowledge is limited to my built-in topics and what you teach me.\n\nTeach me with:\nteach: " + t + " => your answer\n\nOr type \"topics\" to see what I know.";
}

// ====== UI ======
const esc = s => s.replace(/[&<>]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));
const render = s => esc(s).replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, x) => "<pre><code>" + x + "</code></pre>").replace(/`([^`\n]+)`/g, "<code>$1</code>");

function addMsg(role, text) {
  const e = $("empty"); if (e) e.remove();
  const d = document.createElement("div"); d.className = "msg " + (role === "user" ? "user" : "bot");
  if (role === "user") d.textContent = text; else d.innerHTML = render(text);
  $("chat").appendChild(d); $("chat").scrollTop = $("chat").scrollHeight;
}
function welcome() {
  $("chat").innerHTML = '<div class="empty" id="empty"><h2 class="logo">Hello! 👋</h2>Ask me about coding, do math, or teach me something.<div class="chips">' +
    ["How do I center a div?", "async await", "git commands", "12*(3+4)", "topics"].map(s => '<button class="chip">' + s + "</button>").join("") + "</div></div>";
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => { $("input").value = b.textContent; send(); });
}
function send() {
  const t = $("input").value.trim(); if (!t) return; $("input").value = "";
  addMsg("user", t); setTimeout(() => addMsg("bot", answer(t)), 250);
}
$("send").onclick = send;
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !/Mobi|Android/i.test(navigator.userAgent)) { e.preventDefault(); send(); } });

// ====== GOOGLE LOGIN (front-end only) ======
const jwt = t => { try { return JSON.parse(decodeURIComponent(escape(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))))); } catch { return null; } };
function showApp(tk) {
  const u = jwt(tk); if (!u || u.exp * 1000 < Date.now()) return logout();
  sessionStorage.setItem("zorn_token", tk);
  $("login").style.display = "none"; $("app").style.display = "flex"; $("userbox").hidden = false;
  $("uname").textContent = u.given_name || u.name || ""; $("avatar").src = u.picture || ""; welcome();
}
function logout() {
  sessionStorage.removeItem("zorn_token"); $("app").style.display = "none"; $("login").style.display = "flex"; $("userbox").hidden = true;
  if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
}
$("logout").onclick = logout;
const wait = setInterval(() => {
  if (!(window.google && google.accounts)) return; clearInterval(wait);
  if (GOOGLE_CLIENT_ID.startsWith("YOUR_")) { $("warn").textContent = "Set GOOGLE_CLIENT_ID at the top of the script first."; return; }
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: r => showApp(r.credential) });
  google.accounts.id.renderButton($("gbtn"), { theme: "filled_blue", size: "large", text: "continue_with", shape: "pill" });
}, 100);
const saved = sessionStorage.getItem("zorn_token"); if (saved) showApp(saved);
</script>
</body>
</html>
